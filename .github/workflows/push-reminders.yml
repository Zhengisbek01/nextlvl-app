name: Push reminders
on:
  schedule:
    - cron: "0 2,5,8,12,16 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "morning / habits / midday / tasks / evening"
        required: false
        default: ""
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send reminders
        run: |
          SLOT="${{ github.event.inputs.slot }}"
          URL="https://next-lvl.kz/api/push-send"
          if [ -n "$SLOT" ]; then URL="$URL?slot=$SLOT&force=1"; fi
          curl -fsS --retry 3 --retry-delay 20 -X POST "$URL" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
